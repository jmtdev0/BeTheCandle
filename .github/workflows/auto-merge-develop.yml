name: Auto Merge Claude Develop Branches

on:
  push:
    branches:
      - 'claude/*develop*'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get source branch name
        id: branch
        run: |
          echo "source_branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "Source branch: ${GITHUB_REF#refs/heads/}"

      - name: Merge to develop
        run: |
          # Fetch the latest develop branch
          git fetch origin develop:develop

          # Checkout develop
          git checkout develop

          # Merge the source branch
          git merge --no-ff origin/${{ steps.branch.outputs.source_branch }} -m "Auto-merge ${{ steps.branch.outputs.source_branch }} into develop"

          # Push to develop
          git push origin develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on success
        if: success()
        run: |
          echo "✅ Successfully merged ${{ steps.branch.outputs.source_branch }} into develop"

      - name: Comment on failure
        if: failure()
        run: |
          echo "❌ Failed to merge ${{ steps.branch.outputs.source_branch }} into develop"
          exit 1
